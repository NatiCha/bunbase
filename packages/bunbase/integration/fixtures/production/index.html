<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BunBase production smoke</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="flex flex-col gap-4 p-8">
      <h1 class="text-2xl font-bold">Production smoke</h1>
      <form id="login">
        <label>Email <input name="email" type="email" required /></label>
        <label>Password <input name="password" type="password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <output id="auth"></output>
      <button id="subscribe">Subscribe</button>
      <output id="connection"></output>
      <output id="event"></output>
      <button id="create">Create task</button>
      <output id="record"></output>
      <label>File <input id="file" type="file" /></label>
      <button id="upload">Upload</button>
      <output id="uploaded"></output>
      <output id="error"></output>
    </main>
  </body>
</html>
